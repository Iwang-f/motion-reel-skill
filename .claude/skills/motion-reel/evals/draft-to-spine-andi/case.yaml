expected_outcome: |
  From the ANDI draft, the run settles what is open, writes a story spine and then a VO script inside the word budget.
  The first spoken line gives a stranger a reason to care instead of opening on a figure. The product answers the
  film's question in the second half, and the film ends on one cheap action. Nothing is generated or rendered.
